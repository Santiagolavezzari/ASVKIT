<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASV Kit · Registro de Dispositivo</title>
  <meta name="description" content="Registro de nueva cuenta vinculada a hardware ASV Kit." />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: var(--bg-subtle);
    }

    /* ── Password strength ── */
    .pw-bar {
      flex: 1; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,0.08);
      transition: background .3s, transform .2s;
    }
    .pw-bar.active-weak   { background: #EF4444; }
    .pw-bar.active-fair   { background: #F59E0B; }
    .pw-bar.active-good   { background: #3b82f6; }
    .pw-bar.active-strong { background: #10B981; }

    .pw-req {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: rgba(255,255,255,0.35);
      transition: color .2s;
    }
    .pw-req.met { color: #10B981; }
    .pw-req-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
      transition: background .2s, box-shadow .2s;
    }
    .pw-req.met .pw-req-dot {
      background: #10B981;
      box-shadow: 0 0 6px rgba(16,185,129,0.5);
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      animation: fadeIn .5s ease both;
    }

    .login-logo {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 32px;
    }

    #login-card {
      padding: 32px 28px;
    }

    /* ── Header ────────────────────────────────────────── */
    .login-header { margin-bottom: 32px; }
    .login-title {
      font-family: 'Cal Sans', sans-serif; font-size: 24px;
      color: var(--text-main); line-height: 1.1; margin-bottom: 8px;
    }
    .login-sub { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    /* ── Input overrides ─────────────────────────────── */
    .form-group { margin-bottom: 20px; }
    .form-label { font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-deep); }
    
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-muted);
      pointer-events: none; transition: color .2s;
    }
    .input-wrap .form-input { padding-left: 36px; padding-right: 12px; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); box-shadow: none; font-size: 14px; }
    .input-wrap .form-input:focus { border-color: rgba(255,255,255,0.2); box-shadow: 0 0 0 2px rgba(255,255,255,0.05); }
    .input-wrap .form-input:focus ~ .input-icon { color: var(--text-main); }

    .pw-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      padding: 4px; display: flex; align-items: center; justify-content: center;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--text-main); }
    .pw-toggle svg { width: 16px; height: 16px; }
    .input-wrap.has-toggle .form-input { padding-right: 40px; }

    /* ── Error banner ────────────────────────────────── */
    .login-error {
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--red); border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; font-weight: 500; margin-bottom: 20px;
      display: none; align-items: flex-start; gap: 8px; line-height: 1.4;
    }
    .login-error.show { display: flex; animation: errorIn .3s ease both; }
    
    .login-success {
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--green); border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; font-weight: 500; margin-bottom: 20px;
      display: none; align-items: flex-start; gap: 8px; line-height: 1.4;
    }
    .login-success.show { display: flex; animation: errorIn .3s ease both; }

    .login-error svg, .login-success svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

    @keyframes errorIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .shake { animation: shakeCard .4s; }

    /* ── Submit button ───────────────────────────────── */
    .login-btn { width: 100%; padding: 10px 16px; font-size: 14px; margin-bottom: 20px; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Footer link ─────────────────────────────────── */
    .login-footer { text-align: center; margin-top: 32px; font-size: 13px; font-weight: 500; }
    .login-footer a { color: var(--text-muted); text-decoration: none; transition: color .15s; }
    .login-footer a:hover { color: var(--text-main); }
  </style>
</head>

<body>
  <div class="login-wrap">
    <!-- Logo -->
    <div class="login-logo">
      <img src="asv-logo.png" alt="ASV Logo" style="height:28px; width:auto; filter:brightness(0) invert(1);" />
    </div>

    <!-- Card -->
    <div class="card" id="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="login-title">Crear tu cuenta</div>
        <p class="login-sub">Vincula tu hardware ingresando el código de la pantalla de tu pulsera.</p>
      </div>

      <!-- Error -->
      <div class="login-error" id="login-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="login-error-text">Error.</span>
      </div>
      
      <!-- Success -->
      <div class="login-success" id="login-success" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="login-success-text">Registro exitoso. Redirigiendo...</span>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input class="form-input" type="text" id="username" placeholder="Nombre de usuario" autocomplete="username" autofocus />
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input class="form-input" type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap has-toggle">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="form-input" type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" oninput="evaluatePassword(this.value)" />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePassword()">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <!-- Strength Meter -->
        <div id="pw-strength-wrap" style="margin-top:10px;display:none">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div style="display:flex;gap:4px;flex:1">
              <div class="pw-bar" id="pw-bar-1"></div>
              <div class="pw-bar" id="pw-bar-2"></div>
              <div class="pw-bar" id="pw-bar-3"></div>
              <div class="pw-bar" id="pw-bar-4"></div>
            </div>
            <span id="pw-strength-label" style="font-size:12px;font-weight:600;margin-left:10px;transition:color .2s">—</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">
            <div class="pw-req" id="req-len">  <span class="pw-req-dot"></span> Mínimo 8 caracteres</div>
            <div class="pw-req" id="req-upper"><span class="pw-req-dot"></span> Al menos 1 letra mayúscula</div>
            <div class="pw-req" id="req-num">  <span class="pw-req-dot"></span> Al menos 1 número</div>
            <div class="pw-req" id="req-sym">  <span class="pw-req-dot"></span> Al menos 1 símbolo (!@#$...)</div>
          </div>
        </div>
      </div>

      <!-- Hardware Code -->
      <div class="form-group mb-0">
        <label class="form-label" for="hw-code">Código de Dispositivo (4 caracteres)</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/></svg>
          <input class="form-input" type="text" id="hw-code" placeholder="Ej: B9C2" maxlength="4" style="text-transform: uppercase;" />
        </div>
      </div>

      <!-- Submit -->
      <button class="btn btn-primary login-btn" id="register-btn" onclick="doRegister()" style="margin-top: 24px;">
        Registrarse y Vincular
      </button>

    </div>

    <!-- Footer -->
    <div class="login-footer">
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:5000';

    document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('email').focus(); });
    document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('hw-code').focus(); });
    document.getElementById('hw-code').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

    function togglePassword() {
      const input  = document.getElementById('password');
      const eyeOn  = document.getElementById('eye-icon');
      const eyeOff = document.getElementById('eye-off-icon');
      const toggle = document.getElementById('pw-toggle');
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      eyeOn.style.display  = visible ? 'none'  : '';
      eyeOff.style.display = visible ? ''      : 'none';
      toggle.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    function showError(msg) {
      const err = document.getElementById('login-error');
      const card = document.getElementById('login-card');
      document.getElementById('login-error-text').textContent = msg;
      err.classList.add('show');
      err.style.animation = 'none';
      err.offsetHeight;
      err.style.animation = '';
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
    }
    
    function showSuccess(msg) {
      const suc = document.getElementById('login-success');
      document.getElementById('login-success-text').textContent = msg;
      suc.classList.add('show');
    }

    function hideError() { document.getElementById('login-error').classList.remove('show'); }

    function evaluatePassword(val) {
      const wrap = document.getElementById('pw-strength-wrap');
      wrap.style.display = val.length > 0 ? 'block' : 'none';

      const hasLen   = val.length >= 8;
      const hasUpper = /[A-Z]/.test(val);
      const hasNum   = /[0-9]/.test(val);
      const hasSym   = /[^A-Za-z0-9]/.test(val);

      // Update requirement indicators
      document.getElementById('req-len').classList.toggle('met', hasLen);
      document.getElementById('req-upper').classList.toggle('met', hasUpper);
      document.getElementById('req-num').classList.toggle('met', hasNum);
      document.getElementById('req-sym').classList.toggle('met', hasSym);

      // Score 0-4
      const score = [hasLen, hasUpper, hasNum, hasSym].filter(Boolean).length;
      const bars = [1,2,3,4].map(i => document.getElementById('pw-bar-' + i));
      const label = document.getElementById('pw-strength-label');
      const classes = ['active-weak','active-fair','active-good','active-strong'];
      const labels  = ['Débil','Media','Buena','Fuerte'];
      const colors  = ['#EF4444','#F59E0B','#3b82f6','#10B981'];

      bars.forEach((b, i) => {
        b.className = 'pw-bar';
        if (i < score) b.classList.add(classes[score - 1]);
      });
      label.textContent = score > 0 ? labels[score - 1] : '—';
      label.style.color = score > 0 ? colors[score - 1] : 'rgba(255,255,255,0.3)';
    }

    async function doRegister() {
      const btn      = document.getElementById('register-btn');
      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const code     = document.getElementById('hw-code').value.trim();

      if (!username || !email || !password || !code) { showError('Completa todos los campos para continuar.'); return; }
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) { showError('Ingresa un correo electrónico válido (ej: nombre@dominio.com).'); return; }
      
      if (password.length < 8) { showError('La contraseña debe tener al menos 8 caracteres.'); return; }
      if (!/[A-Z]/.test(password)) { showError('La contraseña debe contener al menos una letra mayúscula.'); return; }
      if (!/[0-9]/.test(password)) { showError('La contraseña debe contener al menos un número.'); return; }
      if (code.length !== 4) { showError('El código debe tener exactamente 4 caracteres.'); return; }
      
      btn.textContent = 'Vinculando...'; btn.disabled = true; hideError();

      try {
        const res  = await fetch(API + '/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, code })
        });
        const data = await res.json();
        
        if (res.ok) {
          // Mostrar pantalla de "revisá tu correo" en vez de redirigir al login
          const card = document.getElementById('login-card');
          card.innerHTML = `
            <div style="text-align:center;padding:8px 0">
              <div style="width:64px;height:64px;border-radius:50%;background:rgba(41,151,255,0.12);border:1px solid rgba(41,151,255,0.28);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2997ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </div>
              <div style="font-size:20px;font-weight:700;margin-bottom:10px;">¡Cuenta creada!</div>
              <p style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:28px;">
                Te enviamos un correo a <strong style="color:var(--text-main)">${email}</strong>.<br>
                Hacé click en el link que recibiste para verificar tu dirección y activar tu cuenta.
              </p>
              <p style="font-size:12px;color:var(--text-muted);margin-bottom:24px;">
                ¿No lo recibiste? Revisá la carpeta de spam o
                <a href="/verify-email.html" style="color:var(--text-main)">pedí un nuevo link</a>.
              </p>
              <a href="login.html" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text-muted);text-decoration:none;border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:8px;transition:color .15s">
                Ir al login
              </a>
            </div>
          `;
        } else {
          showError(data.error || 'No se pudo completar el registro.');
          btn.textContent = 'Registrarse y Vincular'; btn.disabled = false;
        }
      } catch {
        showError('Error de conexión con el servidor.');
        btn.textContent = 'Registrarse y Vincular'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
